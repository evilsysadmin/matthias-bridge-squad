<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07191f">
  <meta name="description" content="Matthias Bridge Squad: atraviesa las puertas, recluta tu ejército y derriba a los jefes. 12 niveles tácticos.">
  <title>Matthias Bridge Squad — ShadowOps</title>
  <style>
    :root{color-scheme:dark;--ink:#07191e;--pale:#e8f9ef;--muted:#a8c3c6;--lime:#d7f770;--aqua:#7cf6de;--orange:#ffbc78;--red:#ff7e83;--panel:rgba(8,27,31,.84)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--pale);overscroll-behavior:none}
    #game{display:block;width:100vw;height:100dvh;touch-action:none;outline:none;cursor:crosshair}
    #vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,18,23,.5),transparent 18%,transparent 70%,rgba(4,18,25,.45));z-index:1}
    .hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,2.4vw,34px)}
    .top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;filter:drop-shadow(0 3px 14px #0008)}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,#eaffb9,#a7f370);color:#183b2b;font-size:26px;box-shadow:0 5px 25px #a9eb7740;transform:rotate(-6deg)}
    .brand strong{display:block;font-weight:900;font-size:clamp(12px,1.5vw,17px);letter-spacing:.1em;line-height:1.15}.brand small{color:#b1dacd;font-size:10px;letter-spacing:.22em;font-weight:900}
    .scoreboard{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:74px;padding:8px 14px;background:rgba(8,30,34,.68);border:1px solid #c6ffde2a;border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 4px 24px #0002}.stat .value{font-size:clamp(18px,2.2vw,26px);font-weight:950;line-height:1.15;font-variant-numeric:tabular-nums}.stat .label{font-size:9px;font-weight:900;letter-spacing:.17em;color:#9dcac6;margin-top:4px}.stat.soldiers .value{color:var(--aqua)}.stat.attack .value{color:var(--orange)}
    .actions{display:flex;gap:7px;pointer-events:auto}.iconbtn{display:grid;place-items:center;width:43px;height:43px;border-radius:12px;background:#071b229c;border:1px solid #c6ffde40;color:#ebfff4;font-size:18px;cursor:pointer;backdrop-filter:blur(10px);transition:background .14s,transform .14s}.iconbtn:hover,.iconbtn:focus-visible{background:#305b59;transform:translateY(-1px)}.iconbtn:disabled{opacity:.4;cursor:default}
    .bottom{display:flex;flex-direction:column;align-items:center;gap:10px}.guard-chip{font-size:11px;font-weight:900;letter-spacing:.08em;color:#f1ffcb;text-shadow:0 2px 9px #092b24;padding:5px 12px;border:1px solid #d8fa9f70;border-radius:18px;background:#214b3eb8}.guard-chip[hidden]{display:none}.progress{height:9px;width:min(560px,70vw);background:#103c43b5;border:1px solid #d4ffed4d;border-radius:50px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#66e3ca,#d5f67a);border-radius:inherit;transition:width .2s;box-shadow:0 0 20px #d2ff89}
    .lowerrow{width:100%;display:flex;align-items:end;justify-content:space-between;gap:12px}.toast{display:flex;align-items:center;gap:11px;max-width:570px;border:1px solid #c8fff23d;background:#06252bb8;border-radius:13px;padding:11px 15px;backdrop-filter:blur(12px);color:#efffef;font-size:clamp(11px,1.3vw,13px);font-weight:600;line-height:1.4;box-shadow:0 9px 32px #001c24a8}.toast .mhead{font-size:25px}.toast b{color:#dbffa1}.hint{color:#e0eee8;font-size:11px;font-weight:700;letter-spacing:.07em;text-shadow:0 2px 6px #03181c;text-align:right}
    .screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at center,#0b303299,#03131be5 68%);backdrop-filter:blur(8px)}.screen[hidden],.hud[hidden],.toast[hidden]{display:none!important}
    .modal{position:relative;width:min(580px,96vw);max-height:min(92dvh,900px);overflow:auto;padding:clamp(25px,5vw,43px);border:1px solid #beffcf55;border-radius:25px;background:linear-gradient(155deg,rgba(16,55,55,.96),rgba(5,23,32,.97) 70%);box-shadow:0 25px 110px #000b,0 0 60px #7bf7be18;scrollbar-color:#3a766b transparent}
    .modal:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#a5f197,#67dac7,#f2c073);border-radius:25px 25px 0 0}.eyebrow{color:#b6f0bf;letter-spacing:.27em;font-weight:900;font-size:11px;text-transform:uppercase;margin:0 0 12px}.modal h1{font-size:clamp(35px,7vw,66px);line-height:.98;letter-spacing:-.068em;text-transform:uppercase;margin:0 0 16px;font-weight:1000}.modal h1 em{font-style:normal;color:var(--lime)}.modal h2{font-size:clamp(27px,5vw,41px);line-height:1.03;letter-spacing:-.05em;margin:0 0 13px}.modal p{line-height:1.65;color:#bad4d2;font-size:14px;margin:0 0 20px}.rule{height:1px;background:#b9f4cc25;margin:22px 0}.featurechips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.chip{border:1px solid #b4eadb35;border-radius:9px;padding:8px 10px;color:#c9e8de;background:#1b4c4a66;font-size:11px;font-weight:800;letter-spacing:.02em}
    .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:12px;padding:17px 19px;background:linear-gradient(135deg,#e9fd97,#a8ed8e);color:#14332d;font-size:15px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 28px #acfa8545;transition:transform .14s,filter .14s}.cta:hover,.cta:focus-visible{transform:translateY(-2px);filter:brightness(1.07)}.secondary{display:block;width:100%;margin-top:10px;text-align:center;text-decoration:none;border:1px solid #b8e8d43e;border-radius:11px;background:#21464d7a;color:#dff3e8;padding:13px;font-weight:850;font-size:13px;cursor:pointer}.secondary:hover,.secondary:focus-visible{background:#32666c99}.mutedlink{border:0;background:none;color:#91c1b9;font-weight:750;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
    .rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:17px 0}.metric{border:1px solid #b2ffe530;border-radius:12px;padding:14px 8px;text-align:center;background:#163c4060}.metric b{display:block;color:#e9fda5;font-size:25px}.metric span{display:block;color:#a4cdcc;font-weight:800;font-size:10px;margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
    .stars{font-size:34px;letter-spacing:9px;text-align:center;color:#e6f69b;margin:12px 0 20px;text-shadow:0 2px 21px #f5ef6445}.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:20px 0}.level{min-height:79px;padding:9px 5px;border:1px solid #c2efdf40;border-radius:11px;background:#1743447d;color:#eaffea;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;cursor:pointer}.level:hover:not(:disabled){background:#2e6d62}.level:disabled{opacity:.4;cursor:not-allowed}.level strong{font-size:23px}.level span{color:#b0dfcd;font-size:11px;letter-spacing:1px;white-space:nowrap}.level.current{outline:2px solid #d5f680;background:#456c4d70}
    .stagename{font-weight:850;color:#eaffcc;font-size:14px}.tiny{font-size:11px!important;line-height:1.5!important}.footer{font-size:10px;color:#87b9b2;text-align:center;margin-top:16px;letter-spacing:.12em;font-weight:800}.danger{color:#ffaba6!important}.key{display:inline-block;border:1px solid #d4f9e179;padding:1px 5px;border-radius:4px;font-weight:900;color:#e2f9df}
    @media(max-width:750px){.hud{padding:12px}.brand{gap:7px}.mark{width:34px;height:34px;font-size:20px;border-radius:9px}.brand strong{font-size:11px}.brand small{font-size:7px}.top{gap:5px}.scoreboard{gap:4px}.stat{min-width:52px;padding:7px 6px}.stat .value{font-size:17px}.stat .label{font-size:8px;letter-spacing:0}.iconbtn{width:34px;height:34px;font-size:15px}.actions{gap:4px}.lowerrow{align-items:center}.toast{max-width:80%;font-size:10px;padding:8px 10px}.toast .mhead{font-size:19px}.hint{font-size:9px}.progress{width:85vw}.levels{grid-template-columns:repeat(3,1fr)}.modal{padding:26px}.modal h1{font-size:47px}}
    @media(max-width:410px){.brand small{display:none}.brand strong{font-size:9px}.mark{width:30px;height:30px;font-size:18px}.stat{min-width:45px}.stat .value{font-size:14px}.stat .label{font-size:7px}.hint{display:none}.toast{max-width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<canvas id="game" aria-label="Campo de batalla de Matthias Bridge Squad" tabindex="0"></canvas>
<div id="vignette"></div>
<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="brand"><span class="mark">♟</span><div><strong>MATTHIAS<br>BRIDGE SQUAD</strong><small>SHADOWOPS</small></div></div>
    <div class="scoreboard">
      <div class="stat"><span class="value" id="stageNo">01</span><span class="label">NIVEL</span></div>
      <div class="stat soldiers"><span class="value" id="soldierCount">8</span><span class="label">TROPAS</span></div>
      <div class="stat attack"><span class="value" id="attackValue">1.0×</span><span class="label">ATAQUE</span></div>
    </div>
    <div class="actions"><button class="iconbtn" id="muteBtn" title="Silenciar audio (M)" aria-label="Silenciar audio">♪</button><button class="iconbtn" id="pauseBtn" title="Pausa (P)" aria-label="Pausar">Ⅱ</button></div>
  </div>
  <div class="bottom">
    <div class="progress" role="progressbar" aria-label="Progreso de nivel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="progressBar"></div></div>
    <div class="guard-chip" id="heroGuard" role="status" aria-live="polite" hidden>🛡 HÉROE · ESCUDO LISTO</div>
    <div class="lowerrow"><div class="toast" id="toast"><span class="mhead">♟</span><span id="toastText"><b>Matthias:</b> Formación, desgraciados.</span></div><span class="hint" id="controlHint">ARRASTRA / RATÓN / A · D PARA MOVERTE</span></div>
  </div>
</div>
<div class="screen" id="screen"><div class="modal" id="modal"></div></div>
<script>
(() => {
  'use strict';
  const $=s=>document.querySelector(s), canvas=$('#game'), ctx=canvas.getContext('2d',{alpha:false});
  const ui={hud:$('#hud'),screen:$('#screen'),modal:$('#modal'),stage:$('#stageNo'),count:$('#soldierCount'),atk:$('#attackValue'),guard:$('#heroGuard'),prog:$('#progressBar'),progress:$('.progress'),toast:$('#toast'),toastText:$('#toastText'),mute:$('#muteBtn'),pause:$('#pauseBtn')};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
  const rand=(seed)=>{let s=seed>>>0;return()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296}};
  const safeRead=(key,fallback)=>{try{const data=JSON.parse(localStorage.getItem(key));return data??fallback}catch{return fallback}};
  const save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
  let PROGRESS_KEY='shadowops.mbs.progress.v1';
  const SETTINGS_KEY='shadowops.mbs.settings.v1';
  // Browser-local campaign records are namespaced by the UUID verified by the edge.
  // An unverified user name, query string or JWT payload can never select a save.
  const loadProgress=()=>{
    const rawProgress=safeRead(PROGRESS_KEY,{});
    return {unlocked:clamp(Number(rawProgress.unlocked)||1,1,12),stars:Array.from({length:12},(_,i)=>clamp(Number(rawProgress.stars?.[i])||0,0,3)),best:Array.from({length:12},(_,i)=>Math.max(0,Number(rawProgress.best?.[i])||0)),wins:Math.max(0,Number(rawProgress.wins)||0)};
  };
  let progress=loadProgress();
  let settings=safeRead(SETTINGS_KEY,{muted:false});settings.muted=!!settings.muted;
  const stageNames=['El primer puente','Reclutas bajo fuego','Operación Multiplica','El cañón del cobre','Salvar al héroe','La doble emboscada','Sector Escarlata','El puente estrecho','Carga de los veteranos','Lluvia de metralla','Fortaleza de hierro','El juicio de Matthias'];
  const bossNames=['SARGENTO CHATARRA','CAPITÁN GRUÑÓN','MAYOR OXIDADO','BARÓN DE ACERO','GENERAL PLANCHADOR','DUQUE DEL CAÑÓN','LA APISONADORA','COLOSO DEL PUENTE','MARISCAL RUIDOSO','EL DEMOLEDOR','TITÁN DE ACERO','EL GRAN CABRONAZO'];
  const stageThemes=[['#2a6a78','#e3ad78','#446c68'],['#306577','#d3b08a','#4b7670'],['#48678d','#e4a6a4','#556d89'],['#785d6d','#f4c47e','#6f6574'],['#39627a','#e7c18a','#456b7b'],['#315772','#d18e83','#4a5d80'],['#654e70','#efa38d','#5d5b7d'],['#446578','#f3cc9e','#3b6c6f'],['#575b70','#f5bd83','#657a74'],['#6b526c','#e7a6a5','#53677f'],['#33566a','#d9b58d','#496a81'],['#443f64','#f2ac7f','#665476']];
  let W=1200,H=760,DPR=1,game=null,state='menu',selectedStage=1,t=0,last=0,keys=new Set(),isPointer=false,targetX=0,fx=[],floats=[],screenShake=0,audioCtx=null,toastUntil=0,toastMessage='';
  const MAX_TROOPS=120;
  // One calculation for actual gate crossings and the on-screen forecast.
  // Boss armor is vulnerable in the central firing lane. Outside it the
  // squad's auto-fire has no line of sight: positioning now matters as much
  // as dodging the telegraphed artillery.
  function bossAimFactor(x){
    const distance=Math.abs(x);
    return distance<=1.15?1:distance>=2.25?0:(2.25-distance)/1.1;
  }
  function gateOutcome(troops,gate){
    if(gate.op==='×')return Math.min(MAX_TROOPS,troops*gate.n);
    if(gate.op==='+')return Math.min(MAX_TROOPS,troops+gate.n);
    if(gate.op==='−')return Math.max(1,troops-gate.n);
    if(gate.op==='÷')return Math.max(1,Math.floor(troops/gate.n));
    return troops;
  }

  function levelData(n){
    const r=rand(60017+n*997),length=200+(n-1)*6,groups=[],objects=[];
    const count=n<3?3:n<6?4:5;
    for(let i=0;i<count;i++){
      const z=24+i*(length-68)/count;
      let left,right;
      if(i%3===0){left={op:'+',n:9+n*2+i*2};right={op:'×',n:2};}
      else if(i%3===1){left={op:'×',n:2};right={op:'+',n:17+n*2+i*2};}
      else{left={op:'+',n:24+n*2};right={op:'×',n:2};}
      if(n>=4&&i===count-2){if(n%2){left={op:'−',n:7+n};}else{right={op:'÷',n:2}}}
      if(n>=7&&i===1){left={op:'×',n:3};right={op:'+',n:30+n*3};}
      groups.push({type:'gate',z,left,right,used:false,id:i});
      const hazardZ=z+12+(r()-.5)*3,side=r()>.5?1:-1;
      if(n>=2||i>0)objects.push({type:'hazard',z:hazardZ,x:side*1.62,used:false,strength:Math.ceil(3+n*.8+i),variant:r()>.4?'barrel':'spikes'});
      if(n>1&&i<count-1){objects.push({type:'enemy',z:z+17,x:-side*1.64,hp:16+n*4+i*8,maxHp:16+n*4+i*8,strength:3+Math.floor(n*.7),used:false,shotTimer:0,aimX:null,reload:0});}
    }
    objects.push({type:'crate',z:length*.42,x:n%2?1.62:-1.62,used:false,bonus:0.45+(n>5?0.15:0)});
    objects.push({type:'cage',z:length*.61,x:n%2?-1.62:1.62,hp:20+n*4,maxHp:20+n*4,used:false,liberated:false,reinforcements:7+n*2});
    if(n>3){objects.push({type:'crate',z:length*.78,x:n%2?-1.62:1.62,used:false,bonus:0.35});}
    return {n,name:stageNames[n-1],boss:bossNames[n-1],length,bossHP:140+n*75+(n>=8?100:0),bossFire:2.7-n*.055,start:7+(n>=6?2:0),speed:10.5+(n>6?1.1:0),theme:stageThemes[n-1],groups,objects:objects.sort((a,b)=>a.z-b.z)};
  }
  function makeGame(n){const data=levelData(n);return {...data,world:0,x:-1.65,tx:-1.65,troops:data.start,attack:1,hero:false,heroGuard:false,heroBlocks:0,bossHp:data.bossHP,bossClock:0,bossPhase:0,bossAim:0,bossBlast:0,score:0,kills:0,gates:0,elapsed:0,peak:data.start,shots:0,stageClear:false,message:'',gateChosen:[]};}
  function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
  addEventListener('resize',resize);resize();
  function showScreen(content){ui.screen.hidden=false;ui.modal.innerHTML=content;ui.hud.hidden=state==='menu'||state==='select';}
  function hideScreen(){ui.screen.hidden=true;ui.hud.hidden=false;}
  const btn=(action,label,klass='cta')=>`<button class="${klass}" data-action="${action}">${label}</button>`;
  // The product does not handle production Identity credentials. Switching
  // accounts must happen on the IdP's same-origin, user-confirmed logout page.
  function signoutLink(){return productionHost?'<a class="secondary" href="'+identityIssuer+'/logout?app=bridgesquad">Cerrar sesión / cambiar de cuenta</a>':'';}
  function mainMenu(){state='menu';game=makeGame(selectedStage);ui.hud.hidden=true;showScreen(`<p class="eyebrow">SHADOWOPS PRESENTA · ARCADE TÁCTICO</p><h1>MATTHIAS<br><em>BRIDGE</em><br>SQUAD</h1><p>Un ejército de peones. Puertas que multiplican tropas. Refuerzos prisioneros que interceptan una salva. Cajas de armamento. Y un jefe de muy mala leche al final del puente.</p><div class="featurechips"><span class="chip">⚔ 12 NIVELES</span><span class="chip">♟ MATTHIAS AL MANDO</span><span class="chip">✦ 3 ESTRELLAS POR NIVEL</span><span class="chip">▣ PROGRESO GUARDADO</span></div>${btn('play',`DESPLEGAR ESCUADRÓN · NIVEL ${String(selectedStage).padStart(2,'0')}  →`)}${btn('levels','Elegir nivel','secondary')}${signoutLink()}<p class="tiny" style="margin:17px 0 0">Mueve el ratón, arrastra o usa <span class="key">A</span> / <span class="key">D</span>. La tropa dispara sola. Esquiva las marcas rojas de los tiradores; al jefe se le dispara desde el centro.</p><div class="footer">HECHO CON CARIÑO Y DISCIPLINA PRUSIANA</div>`);}
  function levelsMenu(){state='select';game=makeGame(selectedStage);ui.hud.hidden=true;const cards=Array.from({length:12},(_,i)=>{const n=i+1,locked=n>progress.unlocked,stars=progress.stars[i];return `<button class="level ${n===selectedStage?'current':''}" data-action="pick" data-level="${n}" ${locked?'disabled':''}><strong>${locked?'🔒':String(n).padStart(2,'0')}</strong><span>${locked?'BLOQUEADO':stars?'★'.repeat(stars)+'☆'.repeat(3-stars):'SIN COMPLETAR'}</span></button>`}).join('');showScreen(`<p class="eyebrow">CAMPAÑA · MISIÓN EN CURSO</p><h2>Selecciona operación</h2><p>Supera cada jefe para desbloquear la siguiente misión. Las estrellas premian rescatar al héroe y conservar tropas.</p><div class="levels">${cards}</div><div class="stagename" id="selectedName">${selectedStage}. ${stageNames[selectedStage-1]}</div><div class="rule"></div>${btn('play','INICIAR OPERACIÓN →')}${btn('menu','← Volver al cuartel','secondary')}<div style="text-align:center;margin-top:20px"><button class="mutedlink" data-action="reset">Borrar progreso local</button></div>`);}
  function pauseMenu(){state='paused';showScreen(`<p class="eyebrow">ALTO EL FUEGO</p><h2>Operación en pausa</h2><p>Matthias te concede cinco segundos de descanso. No te acostumbres.</p>${btn('resume','REANUDAR OPERACIÓN →')}${btn('retry','Reiniciar nivel','secondary')}${btn('menu','Abandonar al cuartel','secondary')}${signoutLink()}`);}
  function endMenu(won){state=won?'won':'lost';const n=game.n;let stars=0,points=game.score+game.troops*12+Math.round((game.attack-1)*300)+game.kills*30;
    if(won){stars=1+Number(game.hero)+Number(game.troops>=Math.min(40,16+n*2));const better=Math.max(stars,progress.stars[n-1]);progress.stars[n-1]=better;progress.best[n-1]=Math.max(points,progress.best[n-1]);progress.wins++;progress.unlocked=Math.max(progress.unlocked,Math.min(12,n+1));save(PROGRESS_KEY,progress);}

  function drawHazard(o){const q=projected(o.x,o.z),s=40*q.p;if(q.dz< -1||q.dz>130)return;ctx.save();ctx.translate(q.x,q.y);ctx.globalAlpha=o.used?.25:1;ctx.fillStyle='#34272266';ctx.beginPath();ctx.ellipse(0,5*q.p,s*.65,s*.25,0,0,7);ctx.fill();if(o.variant==='spikes'){for(let i=-1;i<=1;i++){poly([[i*s*.34-s*.2,0],[i*s*.34,-s*.95],[i*s*.34+s*.22,0]],'#d8dad2','#4d6670');}}else{roundRect(-s*.43,-s*1.04,s*.86,s*.97,5*q.p,'#a7493c');roundRect(-s*.46,-s*.97,s*.92,8*q.p,2,'#e89d6e');roundRect(-s*.46,-s*.37,s*.92,8*q.p,2,'#e89d6e');textDraw('!',0,-s*.62,Math.max(7,s*.48),'#fff0ad')}ctx.restore();}
  function drawCrate(o){const q=projected(o.x,o.z),s=52*q.p;if(q.dz< -1||q.dz>130)return;ctx.save();ctx.globalAlpha=o.used?.22:1;ctx.translate(q.x,q.y);ctx.rotate(Math.sin(t*2.5+o.z)*.04);roundRect(-s*.5,-s*.88,s,s*.88,5*q.p,'#f3bf66');roundRect(-s*.5,-s*.88,s,s*.18,3*q.p,'#ffe0a0');roundRect(-s*.4,-s*.66,s*.8,s*.44,3*q.p,'#94613d');textDraw('ATK',0,-s*.44,Math.max(7,s*.34),'#ffeda0');line(-s*.5,-s*.08,s*.5,-s*.08,'#d4864a',4*q.p);ctx.restore();}
  function drawCage(o){const q=projected(o.x,o.z),s=65*q.p;if(q.dz< -1||q.dz>130)return;ctx.save();ctx.translate(q.x,q.y);ctx.globalAlpha=o.used?.17:1;const bob=Math.sin(t*2)*2*q.p;roundRect(-s*.56,-s*1.35+bob,s*1.12,s*1.38,4*q.p,'#394850');roundRect(-s*.46,-s*1.19+bob,s*.92,s*1.07,3*q.p,'#b6eacb24');textDraw('♟',0,-s*.64+bob,Math.max(12,s*.62),'#effba1');for(let i=-2;i<=2;i++)line(i*s*.20,-s*1.32+bob,i*s*.20,-s*.02+bob,'#9ec1bd',Math.max(1,s*.055));line(-s*.56,-s*1.33+bob,s*.56,-s*1.33+bob,'#d8d6af',Math.max(2,s*.09));if(o.hp>0)healthBar(0,-s*1.6,s,8*q.p,o.hp/o.maxHp,'#d4f795');ctx.restore();}
  function healthBar(x,y,width,height,ratio,color){roundRect(x-width/2,y,width,height,Math.max(1,height/2),'#081c24dc');roundRect(x-width/2+2,y+2,Math.max(0,(width-4)*clamp(ratio,0,1)),Math.max(0,height-4),Math.max(1,height/2),color);}
  function drawEnemy(o){const q=projected(o.x,o.z);if(q.dz< -1||q.dz>130)return;const s=46*q.p;ctx.save();ctx.translate(q.x,q.y);ctx.globalAlpha=o.used?.15:1;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,3*q.p,s*.6,s*.22,0,0,7);ctx.fill();roundRect(-s*.36,-s*1.25,s*.72,s*.72,4*q.p,'#a94755');roundRect(-s*.28,-s*1.71,s*.56,s*.53,s*.24,'#d77977');roundRect(-s*.3,-s*1.7,s*.6,s*.17,2,'#7d2f3b');roundRect(s*.2,-s*.9,s*.42,s*.12,1,'#384e52');textDraw('⚡',0,-s*.93,Math.max(7,s*.3),'#ffe49b');healthBar(0,-s*1.93,s*1.3,8*q.p,o.hp/o.maxHp,'#ff8e8b');ctx.restore();
    // Telegraph from the sentry to a FIXED spot on the player's lane.
    // The red marker persists for the full windup but never follows a dodge.
    if(o.shotTimer>0&&o.aimX!==null){
      const hit=projected(o.aimX,game.world+4.4);
      const pulse=.4+.3*Math.sin(t*17);
      ctx.save();
      line(q.x,q.y-s*1.1,hit.x,hit.y-8*hit.p,'#ff8067a8',Math.max(1,2.2*hit.p));
      ctx.fillStyle=`rgba(255,88,82,${pulse})`;ctx.beginPath();
      ctx.ellipse(hit.x,hit.y,Math.max(8,26*hit.p),Math.max(4,10*hit.p),0,0,Math.PI*2);ctx.fill();
      textDraw('⚠',hit.x,hit.y-34*hit.p,Math.max(12,21*hit.p),'#ffd1a0');
      ctx.restore();
    }
  }
  function drawBoss(){const q=projected(0,game.length),s=175*q.p;if(q.dz< -1||q.dz>140)return;ctx.save();ctx.translate(q.x,q.y);const wobble=Math.sin(t*2.6)*s*.02;ctx.fillStyle='#06151c6e';ctx.beginPath();ctx.ellipse(0,s*.08,s*.8,s*.27,0,0,7);ctx.fill();roundRect(-s*.69,-s*.37,s*1.38,s*.33,s*.15,'#2d363d');for(const i of [-1,1]){roundRect(i*s*.44-s*.21,-s*.4,s*.42,s*.38,s*.14,'#485258');for(let j=0;j<3;j++)line(i*s*.44-s*.15+j*s*.12,-s*.34,i*s*.44-s*.15+j*s*.12,-s*.09,'#85918a',Math.max(1,s*.03))}
    roundRect(-s*.46,-s*1.33+wobble,s*.92,s*.94,s*.13,'#6c4b45');roundRect(-s*.35,-s*1.58+wobble,s*.70,s*.42,s*.12,'#a96d5c');roundRect(-s*.38,-s*1.58+wobble,s*.76,s*.13,s*.06,'#d4a985');roundRect(-s*.23,-s*1.37+wobble,s*.46,s*.14,s*.05,'#ffbf81');roundRect(-s*.06,-s*1.03+wobble,s*.12,s*.35,s*.025,'#a2c7ba');roundRect(-s*.56,-s*1.14+wobble,s*.21,s*.55,s*.1,'#536369');roundRect(s*.34,-s*1.17+wobble,s*.45,s*.22,s*.04,'#39474d');roundRect(s*.60,-s*1.13+wobble,s*.34,s*.14,s*.03,'#c6a77d');textDraw('☠',0,-s*.82+wobble,Math.max(11,s*.33),'#fbe7be');
    if(game.bossPhase){textDraw(game.boss,0,-s*2.04,Math.max(9,s*.15),'#ffffff');healthBar(0,-s*1.87,s*2.1,Math.max(8,s*.13),game.bossHp/game.bossHP,'#ff8d80');const lined=bossAimFactor(game.x)>.65;textDraw(lined?'◉ EN MIRA':'↔ ALINEA LA ESCUADRA',0,-s*2.35,Math.max(9,s*.14),lined?'#d7ff9d':'#ffdf9c')}else{textDraw('JEFE FINAL',0,-s*1.85,Math.max(9,s*.14),'#ffd5a9')}
    ctx.restore();}
  function drawSoldier(x,z,i,commander=false){const q=projected(x,z),s=(commander?52:25)*q.p*(Math.min(W/900,1.2)*.25+.75);if(q.y>H+60||q.y<0)return;const walk=Math.sin(t*11+i*1.9)*(commander?2.1:1.5)*q.p;ctx.save();ctx.translate(q.x,q.y+walk);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,3*q.p,s*.6,s*.25,0,0,7);ctx.fill();if(commander){roundRect(-s*.31,-s*.75,s*.62,s*.55,s*.15,'#c5dd91');roundRect(-s*.27,-s*1.24,s*.54,s*.65,s*.26,'#e2dfac');roundRect(-s*.37,-s*1.12,s*.74,s*.22,s*.05,'#31564c');roundRect(-s*.3,-s*1.37,s*.6,s*.27,s*.07,'#486653');roundRect(-s*.12,-s*.98,s*.06,s*.09,s*.025,'#344843');roundRect(s*.08,-s*.98,s*.06,s*.09,s*.025,'#344843');line(-s*.15,-s*.84,s*.15,-s*.84,'#625c48',Math.max(1,s*.06));roundRect(-s*.30,-s*.58,s*.60,s*.10,s*.02,'#efcb77');textDraw('★',0,-s*1.25,Math.max(6,s*.23),'#fef1a8');}else{roundRect(-s*.33,-s*.74,s*.66,s*.57,s*.11,'#5dbda6');roundRect(-s*.29,-s*1.22,s*.58,s*.60,s*.2,'#bcf5c0');roundRect(-s*.39,-s*1.2,s*.78,s*.17,s*.045,'#3a8f80');roundRect(-s*.11,-s*.98,s*.09,s*.07,1,'#245653');roundRect(s*.13,-s*.98,s*.09,s*.07,1,'#245653');roundRect(s*.18,-s*.61,s*.45,s*.11,2,'#40555c');}
    ctx.restore();}
  function drawSquad(){if(!game)return;const count=Math.min(54,game.troops),cols=7;if(game.bossPhase===2){const aim=projected(game.bossAim,game.world+4),aw=Math.max(8,Math.min(W*.115,H*.145)*1.25);ctx.save();ctx.globalAlpha=.65+.2*Math.sin(t*20);poly([[aim.x-aw,aim.y+12],[aim.x+aw,aim.y+12],[aim.x+aw*.65,aim.y-120],[aim.x-aw*.65,aim.y-120]],'#ff53515a','#ff8988');textDraw('⚠ ARTILLERÍA',aim.x,aim.y-126,Math.max(9,Math.min(W/65,15)),'#ffdad3');ctx.restore();}else if(game.bossPhase===3&&game.bossBlast>0){const aim=projected(game.bossAim,game.world+4);ctx.beginPath();ctx.arc(aim.x,aim.y,70*(game.bossBlast/.5),0,Math.PI*2);ctx.fillStyle='#ffba6270';ctx.fill();}
    // Draw rear ranks first, leader last: keeps the hero readable.
    for(let i=count-1;i>=0;i--){const row=Math.floor(i/cols),col=i%cols,entries=Math.min(cols,count-row*cols),offset=col-(entries-1)/2,x=clamp(game.x+offset*.43,-3.5,3.5),z=game.world+3.8-row*.59;drawSoldier(x,z,i)}
    if(game.hero){
      // Visible escort keeps the rescue reward legible even after its shield expires.
      const escortX=clamp(game.x-.86,-3.12,3.12),escortZ=game.world+5.0;
      drawSoldier(escortX,escortZ,99);
      const escort=projected(escortX,escortZ);
      textDraw(game.heroGuard?'🛡':'★',escort.x,escort.y-45*escort.p,
        Math.max(11,22*escort.p),game.heroGuard?'#e6ffab':'#ffda91');
    }
    drawSoldier(game.x,game.world+5.5,-1,true);
    const p=projected(game.x,game.world+5.5),badgeY=p.y-85*p.p;if(game.troops>10){roundRect(p.x-25*p.p,badgeY-18*p.p,50*p.p,21*p.p,8*p.p,'#082a32dd');textDraw('×'+game.troops,p.x,badgeY-7*p.p,Math.max(9,17*p.p),'#eaffb6');}
    if(state==='boss'&&bossAimFactor(game.x)>.1){for(let k=0;k<Math.min(8,Math.ceil(game.troops/8));k++){const fireX=game.x+(Math.sin(t*12+k)*.8);const a=projected(fireX,game.world+6),b=projected((Math.random()-.5)*.8,game.world+19);if(Math.sin(t*21+k*2.2)>.48)line(a.x,a.y-20*a.p,b.x,b.y-65*b.p,'#ffdc81be',Math.max(1,2.5*a.p));}}
  }
  function drawFloatingAndFx(dt){for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.life-=dt;p.x+=p.vx*dt/65;p.z+=p.vy*dt/90;const a=projected(p.x,p.z);ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(a.x,a.y,Math.max(1,p.size*a.p),0,7);ctx.fill();if(p.life<=0)fx.splice(i,1)}ctx.globalAlpha=1;for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;const p=projected(f.x,f.z);ctx.save();ctx.globalAlpha=clamp(f.life,0,1);textDraw(f.txt,p.x,p.y-70-35*(1.35-f.life),Math.max(11,19*p.p),f.color);ctx.restore();if(f.life<=0)floats.splice(i,1)}}
  function drawWorld(dt){if(!game)return;ctx.save();if(screenShake>.1){ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);screenShake*=.89;}drawBackground();drawBridge();const objs=[...game.groups,...game.objects,{type:'boss',z:game.length}].sort((a,b)=>b.z-a.z);for(const o of objs){if(o.type==='gate')drawGate(o);else if(o.type==='hazard')drawHazard(o);else if(o.type==='crate')drawCrate(o);else if(o.type==='enemy')drawEnemy(o);else if(o.type==='cage')drawCage(o);else if(o.type==='boss')drawBoss()}
    drawSquad();drawFloatingAndFx(dt);ctx.restore();}
  function frame(ms){requestAnimationFrame(frame);const dt=Math.min((ms-last)/1000||0,.05);last=ms;t+=dt;update(dt);drawWorld(dt);} 
  // Offline builds remain playable. Only the two canonical HTTPS hosts may
  // request an edge-verified account and use a per-user campaign save; each
  // host is pinned to its own ShadowOps ID environment (never cross-env).
  // The Worker still enforces JWT signatures AND server-side freshness.
  const IDENTITY_BY_HOST=Object.freeze({
    'bridgesquad.shadowops.dpdns.org':'https://id.shadowops.dpdns.org',
    'staging.bridgesquad.shadowops.dpdns.org':'https://id-staging.shadowops.dpdns.org'
  });
  const identityIssuer=Object.hasOwn(IDENTITY_BY_HOST,location.hostname)?IDENTITY_BY_HOST[location.hostname]:null;
  const productionHost=identityIssuer!==null;
  const subjectPattern=/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;
  let identitySubject=null,identityExpiresAt=0,renewTimer=null,renewInFlight=false;
  const nowSeconds=()=>Math.floor(Date.now()/1000);
  function acceptedSession(session,subject=null){
    const now=nowSeconds();
    return session&&session.identity==='bridgesquad'&&
      typeof session.subject==='string'&&subjectPattern.test(session.subject)&&
      (subject===null||session.subject===subject)&&
      Number.isSafeInteger(session.expires_at)&&
      session.expires_at>now+2&&session.expires_at<=now+180;
  }
  function lockIdentity(){
    if(renewTimer!==null)clearTimeout(renewTimer);
    renewTimer=null;identitySubject=null;identityExpiresAt=0;
    PROGRESS_KEY='shadowops.mbs.progress.v1';progress=loadProgress();
    state='auth-blocked';game=null;keys.clear();
    showScreen('<p class="eyebrow">SHADOWOPS ID</p><h2>Sesión no disponible</h2><p>Tu sesión ha caducado, ha sido revocada o pertenece a otra cuenta. Vuelve a autenticarte para seguir jugando.</p><a class="secondary" href="/">Volver a ShadowOps ID</a>');
    ui.hud.hidden=true;
  }
  function scheduleRenew(delay){
    if(renewTimer!==null)clearTimeout(renewTimer);
    renewTimer=null;
    if(!identitySubject||document.hidden||state==='auth-blocked')return;
    const remaining=identityExpiresAt*1000-Date.now()-45000;
    renewTimer=setTimeout(()=>void renewIdentity(),delay??Math.max(8000,remaining));
  }
  async function renewIdentity(){
    if(renewInFlight||!identitySubject||state==='auth-blocked')return;
    renewInFlight=true;
    if(renewTimer!==null)clearTimeout(renewTimer);
    renewTimer=null;
    let failure='temporary';
    try{
      // No JWT is persisted or placed in the address bar. It exists only for
      // the HTTPS token exchange into a Secure HttpOnly first-party cookie.
      const tokenResponse=await fetch(identityIssuer+'/api/identity/token',{
        method:'POST',credentials:'include',cache:'no-store',
        headers:{'Content-Type':'application/json'},body:'{}',
        signal:AbortSignal.timeout(8000)
      });
      if(tokenResponse.status===401||tokenResponse.status===403)failure='revoked';
      if(!tokenResponse.ok)throw Error('identity_token_unavailable');
      const payload=await tokenResponse.json();
      if(!payload||typeof payload.token!=='string'||payload.token.length>8192)throw Error('invalid_token');
      const exchanged=await fetch('/api/bridgesquad/session',{
        method:'POST',credentials:'same-origin',cache:'no-store',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:payload.token}),signal:AbortSignal.timeout(8000)
      });
      if(exchanged.status===401||exchanged.status===403)failure='revoked';
      if(!exchanged.ok)throw Error('edge_session_denied');
      const session=await exchanged.json();
      if(!acceptedSession(session,identitySubject)){
        failure='revoked';throw Error('identity_subject_changed_or_expired');
      }
      identityExpiresAt=session.expires_at;
      scheduleRenew();
      return;
    }catch{
      if(failure==='revoked'||nowSeconds()>=identityExpiresAt-2){
        lockIdentity();
      }else{
        // Transient IdP outage: keep the existing, still-fresh session and
        // retry briefly. Never silently switch the account used for saves.
        scheduleRenew(10000);
      }
    }finally{
      renewInFlight=false;
    }
  }
  document.addEventListener('visibilitychange',()=>{
    if(!productionHost||!identitySubject)return;
    if(document.hidden){
      if(renewTimer!==null)clearTimeout(renewTimer);
      renewTimer=null;
    }else{
      void renewIdentity();
    }
  });
  if(productionHost){
    if(location.protocol!=='https:'){
      lockIdentity();
    }else{
      state='auth-check';
      fetch('/api/bridgesquad/session',{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(8000)})
        .then(async response=>{
          if(!response.ok)throw Error('session_denied');
          const session=await response.json();
          if(!acceptedSession(session))throw Error('invalid_identity');
          identitySubject=session.subject;
          identityExpiresAt=session.expires_at;
          PROGRESS_KEY='shadowops.mbs.progress.v1:'+identitySubject;
          progress=loadProgress();
          mainMenu();
          requestAnimationFrame(frame);
          scheduleRenew();
        }).catch(()=>lockIdentity());
    }
  }else{
    mainMenu();requestAnimationFrame(frame);
  }
  // Small read-only test surface for deterministic browser smoke tests.
  Object.defineProperty(window,'__MBS_TEST__',{value:Object.freeze({getState:()=>state,getIdentity:()=>({verified:!!identitySubject,expiresAt:identityExpiresAt}),getSnapshot:()=>game&&({level:game.n,world:game.world,x:game.x,troops:game.troops,attack:game.attack,bossHp:game.bossHp,hero:game.hero,heroGuard:game.heroGuard,heroBlocks:game.heroBlocks,score:game.score}),getProgress:()=>({...progress}),gateOutcome,bossAimFactor,levelData:n=>levelData(clamp(n,1,12))})});
})();
</script>
